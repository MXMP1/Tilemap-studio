<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Tilemap Studio — Бесконечный 2D Редактор Карт</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<div id="app">
  <!-- БОКОВАЯ ПАНЕЛЬ -->
  <div id="sidebar">
    <div class="section">
      <h3>Слои (Layers)</h3>
      <button class="layer-btn active" data-layer="floor">1. Земля (Floor)</button>
      <button class="layer-btn" data-layer="walls">2. Стены (Walls)</button>
      <button class="layer-btn" data-layer="overhead">3. Крыши (Overhead)</button>
    </div>

    <div class="section">
      <h3>Инструменты</h3>
      <button class="tool-btn active" data-tool="brush">🖌 Кисть [B]</button>
      <button class="tool-btn" data-tool="rect">⬜ Прямоуг. [R]</button>
      <button class="tool-btn" data-tool="line">〰 Линия [L]</button>
      <button class="tool-btn" data-tool="fill">🔫 Заливка [F]</button>
      <button class="tool-btn" data-tool="pick">💧 Пипетка [I]</button>
    </div>

    <div class="section">
      <h3>Режим</h3>
      <button class="eraser-btn" id="eraser-btn">🧹 Ластик [E]</button>
      <button class="hero-btn" id="hero-btn">🎮 Режим героя [H]</button>
    </div>

    <div class="section">
      <h3>Кисть</h3>
      <div class="brush-controls">
        <button id="brush-dec">−</button>
        <span id="brush-size-label">1×1</span>
        <button id="brush-inc">+</button>
      </div>
    </div>

    <div class="section">
      <h3>Файл</h3>
      <button id="save-btn" class="action-btn">💾 Сохранить</button>
      <button id="load-btn" class="action-btn">📂 Загрузить</button>
      <button id="export-png-btn" class="action-btn">🖼 Экспорт PNG</button>
      <button id="grid-btn" class="action-btn grid-btn active">🔲 Сетка [G]</button>
    </div>

    <div class="section" style="flex-grow: 1; display: flex; flex-direction: column;">
      <h3>Тайлы (Палитра)</h3>
      <div id="palette-container">
        <canvas id="palette-canvas"></canvas>
      </div>
    </div>
  </div>

  <!-- ИГРОВОЙ ХОЛСТ -->
  <div id="canvas-container">
    <div id="info-overlay">
      Камера: X: 0, Y: 0 | Зум: 100%<br />
      Курсор в мире: X: 0, Y: 0<br />
      Чанк: [0, 0] | Тайл в чанке: (0, 0)
    </div>
    <canvas id="editor"></canvas>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
